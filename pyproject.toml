[tool.poetry]
name = "CalculatorApp"
version = "1.0.0"
description = "Calculatrice 4 opérations avec PySide6, double persistance et tests complets"
authors = ["Vibe Code Agent <vibe@mistral.ai>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/alnews2/EvaluationDeMistralCODE2"
keywords = ["calculator", "pyside6", "qt", "mvvm", "pytest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Qt",
    "Framework :: Pytest",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.10"
PySide6 = { version = "^6.6.0", python = ">=3.10,<3.14" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-qt = "^4.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.1.0"
black = "^24.0.0"
isort = "^5.13.0"
pyinstaller = { version = "^6.0.0", python = ">=3.10,<3.14" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
calculator = "src.main:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
