[pytest]
# Configuration pytest pour CalculatorApp

# Chemins de recherche des tests
testpaths = tests

# Options par défaut
addopts = --cov=src --cov-report=term-missing --cov-report=html

# Configuration de la couverture
coveragerc = .coveragerc

# Plugins
qt_api = pyside6

# Options d'affichage
verbose = 1
showlocals = True

# Fichiers à ignorer
ignore = build dist venv .venv

# Marqueurs personnalisés
markers =
    slow: marque les tests lents
    integration: marque les tests d'intégration
    ui: marque les tests UI
    regression: marque les tests de régression

# Configuration des warnings
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuration des timeout
timeout = 30

# Configuration des tests Qt
qtbot_timeout = 5000
